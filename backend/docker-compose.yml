x-common-volumes: &common-volumes
  - ./artisan:/var/www/html/artisan:cached
  - ./composer.json:/var/www/html/composer.json:cached
  - ./composer.lock:/var/www/html/composer.lock:cached
  - ./app:/var/www/html/app:cached
  - ./routes:/var/www/html/routes:cached
  - ./config:/var/www/html/config:cached
  - ./database:/var/www/html/database:cached
  - ./resources:/var/www/html/resources:cached
  - ./bootstrap:/var/www/html/bootstrap:cached
  - ./public:/var/www/html/public:cached
  - ./.env.example:/var/www/html/.env.example:cached
  - ./.env:/var/www/html/.env:cached
  - vendor:/var/www/html/vendor
  - storage:/var/www/html/storage
  - bootstrap-cache:/var/www/html/bootstrap/cache

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  DB_HOST: db
  DB_DATABASE: ${DB_DATABASE:-mynewshub}
  DB_USERNAME: ${DB_USERNAME:-mynewshub}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  REDIS_HOST: redis

services:
  # PHP Application
  app:
    image: mynewshub/api:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: mynewshub-app
    restart: unless-stopped
    volumes:
      - ./artisan:/var/www/html/artisan:cached
      - ./composer.json:/var/www/html/composer.json:cached
      - ./composer.lock:/var/www/html/composer.lock:cached
      - ./app:/var/www/html/app:cached
      - ./routes:/var/www/html/routes:cached
      - ./config:/var/www/html/config:cached
      - ./database:/var/www/html/database:cached
      - ./resources:/var/www/html/resources:cached
      - ./bootstrap:/var/www/html/bootstrap:cached
      - ./public:/var/www/html/public:cached
      - ./.env.example:/var/www/html/.env.example:cached
      - ./.env:/var/www/html/.env:cached
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mynewshub-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      <<: *app-environment
    healthcheck:
      test: ["CMD", "php", "artisan", "inspire"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: mynewshub-webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Nginx only needs public folder (fast named volume)
      - ./public:/var/www/html/public:ro,cached
      - vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mynewshub-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: mynewshub-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
    volumes:
      - mynewshub-data:/var/lib/mysql
    networks:
      - mynewshub-network
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis for Cache and Queue
  redis:
    image: redis:alpine
    container_name: mynewshub-redis
    restart: unless-stopped
    networks:
      - mynewshub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Queue Worker
  queue-worker:
    image: mynewshub/api:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: mynewshub-queue-worker
    restart: unless-stopped
    entrypoint: []
    command: php artisan queue:work redis --queue=scraping,default --sleep=3 --tries=3 --max-jobs=1000
    volumes: *common-volumes
    networks:
      - mynewshub-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'queue:work' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Scheduler (runs scheduled tasks)
  scheduler:
    image: mynewshub/api:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: mynewshub-scheduler
    restart: unless-stopped
    entrypoint: []
    command: php artisan schedule:work
    volumes: *common-volumes
    networks:
      - mynewshub-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'schedule:work' | grep -v grep || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# Networks
networks:
  mynewshub-network:
    driver: bridge

# Volumes
volumes:
  mynewshub-data:
  vendor:
  storage:
  bootstrap-cache:
